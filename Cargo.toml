[package]
name = "rocket-etagged-raw-response"
version = "0.11.1"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/rocket-etagged-raw-response"
homepage = "https://magiclen.org/rocket-etagged-raw-response"
keywords = ["rocket", "server", "web", "response", "etag"]
categories = ["web-programming"]
description = "This crate provides a response struct used for responding raw data with **Etag** cache."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
rocket = "0.5.2"
mime = "0.3.18"
mime_guess = { version = "2", default-features = false }
educe = { version = "0.8.2", default-features = false, features = ["Debug"] }

rocket-etag-if-none-match = "0.5.1"
# Enable `weak-hasher` on the `entity-tag` used by `rocket-etag-if-none-match`.
entity-tag = { version = "0.2.2", features = ["weak-hasher"] }