[package]
name = "rocket-etagged-raw-response"
version = "0.11.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/rocket-etagged-raw-response"
homepage = "https://magiclen.org/rocket-etagged-raw-response"
keywords = ["rocket", "server", "web", "response", "etag"]
categories = ["web-programming"]
description = "This crate provides a response struct used for responding raw data with **Etag** cache."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
rocket = "0.5"
mime = "0.3.4"
mime_guess = { version = "2", default-features = false }
educe = { version = "0.7", default-features = false, features = ["Debug"] }

rocket-etag-if-none-match = "0.5"
# `EntityTag` comes from `rocket-etag-if-none-match`, which does not enable `weak-hasher` itself. This direct dependency turns that feature on through feature unification, so it has to keep resolving to the very same version of `entity-tag` that `rocket-etag-if-none-match` depends on.
entity-tag = { version = "0.2", features = ["weak-hasher"] }